<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Point Cloud Attractor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="ui">
        <h1>Vibe Particle Cloud</h1>
        <div class="control-group">
            <label class="switch">
                <input type="checkbox" id="lifeToggle" checked>
                <span class="slider"></span>
            </label>
            <span>Life-Death Cycle</span>
        </div>
        <p class="hint">Move mouse to attract particles.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
