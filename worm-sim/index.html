<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORM.NISHA - Nokia Style</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui-container">
        <h1>WORM.NISHA</h1>
        <div class="control-group">
            <label for="death-proximity">Avoidance Proximity (px):</label>
            <input type="number" id="death-proximity" value="8" min="1">
        </div>
        <div class="control-group">
            <label for="death-rate">Death Rate:</label>
            <input type="range" id="death-rate" min="0" max="6" step="0.1" value="0">
            <span id="death-rate-val">0</span>
        </div>
        <div class="control-group">
            <label for="repro-rate">Reproduction Rate:</label>
            <input type="range" id="repro-rate" min="0" max="6" step="0.1" value="2">
            <span id="repro-rate-val">2</span>
        </div>
        <div class="control-group">
            <label>Movement Angles:</label>
            <div id="angle-presets">
                <label><input type="checkbox" class="angle-check" value="0" checked> 0°</label>
                <label><input type="checkbox" class="angle-check" value="45" checked> 45°</label>
                <label><input type="checkbox" class="angle-check" value="90" checked> 90°</label>
                <label><input type="checkbox" class="angle-check" value="135" checked> 135°</label>
                <label><input type="checkbox" class="angle-check" value="180" checked> 180°</label>
                <label><input type="checkbox" class="angle-check" value="225" checked> 225°</label>
                <label><input type="checkbox" class="angle-check" value="270" checked> 270°</label>
                <label><input type="checkbox" class="angle-check" value="315" checked> 315°</label>
            </div>
        </div>

        <div id="button-row">
            <button id="clear-btn">CLEAR</button>
            <button id="export-btn">EXPORT PNG</button>
        </div>

        <div class="instructions">
            <strong>Left Click:</strong> Spawn Worm<br>
            <strong>Right Click:</strong> Save & Stop
        </div>
    </div>
    
    <div id="canvas-container">
        <canvas id="simCanvas" width="540" height="400"></canvas>
        <div id="start-overlay">[ click any pixel to start ]<br><small>right-click ends & exports</small></div>
        
        <div id="status-bar">
            <span>worms: <span id="stat-worms">0</span></span>
            <span>pixels: <span id="stat-pixels">0</span></span>
            <span>ticks: <span id="stat-ticks">0</span></span>
            <span>fps: <span id="stat-fps">0</span></span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
